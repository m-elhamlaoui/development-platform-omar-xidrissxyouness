# frontend-ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spaceforces-frontend-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: spaceforces.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 3000